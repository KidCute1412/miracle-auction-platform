x-ha-environment: &ha-environment
  REDIS_MODE: sentinel
  REDIS_SENTINEL_MASTER: benchmark-primary
  REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  AUCTION_REDIS_URLS: ""
  AUCTION_AUTO_RECOVERY_ENABLED: "true"
  AUCTION_RECOVERY_CHECK_INTERVAL_MS: "2000"
  AUCTION_RECOVERY_GRACE_SECONDS: "300"

services:
  redis-0:
    cpus: "${BENCHMARK_REDIS_0_CPU_LIMIT:-0.3}"

  redis-replica-0:
    cpus: "${BENCHMARK_REDIS_REPLICA_0_CPU_LIMIT:-0.15}"

  redis-1:
    command: ["redis-server", "--replicaof", "redis-0", "6379", "--appendonly", "yes", "--appendfsync", "everysec"]
    depends_on:
      redis-0: { condition: service_healthy }
    cpus: "${BENCHMARK_REDIS_1_CPU_LIMIT:-0.15}"

  redis-replica-1:
    cpus: "${BENCHMARK_REDIS_REPLICA_1_CPU_LIMIT:-0.01}"

  redis-sentinel-1: &sentinel
    image: redis:7-alpine
    command: ["sh", "/opt/auction/sentinel-entrypoint.sh"]
    environment:
      REDIS_SENTINEL_MASTER: benchmark-primary
      REDIS_SENTINEL_MASTER_HOST: redis-0
    volumes:
      - ../../infra/redis/sentinel-entrypoint.sh:/opt/auction/sentinel-entrypoint.sh:ro
      - redis-sentinel-1:/data
    depends_on:
      redis-0: { condition: service_healthy }
      redis-replica-0: { condition: service_healthy }
      redis-1: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    cpus: "${BENCHMARK_REDIS_SENTINEL_CPU_LIMIT:-0.1}"

  redis-sentinel-2:
    <<: *sentinel
    volumes:
      - ../../infra/redis/sentinel-entrypoint.sh:/opt/auction/sentinel-entrypoint.sh:ro
      - redis-sentinel-2:/data

  redis-sentinel-3:
    <<: *sentinel
    volumes:
      - ../../infra/redis/sentinel-entrypoint.sh:/opt/auction/sentinel-entrypoint.sh:ro
      - redis-sentinel-3:/data

  api:
    environment:
      <<: *ha-environment
    depends_on:
      redis-sentinel-1: { condition: service_healthy }
      redis-sentinel-2: { condition: service_healthy }
      redis-sentinel-3: { condition: service_healthy }
    cpus: "${BENCHMARK_HA_API_CPU_LIMIT:-1.35}"

  auction-worker:
    environment:
      <<: *ha-environment
    depends_on:
      redis-sentinel-1: { condition: service_healthy }
      redis-sentinel-2: { condition: service_healthy }
      redis-sentinel-3: { condition: service_healthy }
    cpus: "${BENCHMARK_HA_AUCTION_WORKER_CPU_LIMIT:-1.15}"

  outbox-relay:
    environment:
      <<: *ha-environment

  async-worker:
    environment:
      <<: *ha-environment

volumes:
  redis-sentinel-1:
  redis-sentinel-2:
  redis-sentinel-3:
