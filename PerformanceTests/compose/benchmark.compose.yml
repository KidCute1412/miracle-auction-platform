services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: online_auction_benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d online_auction_benchmark"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: ["postgres:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: ["redis:/data"]

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis", "6379", "--appendonly", "yes", "--appendfsync", "everysec"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: ["kafka:/var/lib/kafka/data"]

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on: [kafka]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done;
        for topic in bidding_events domain_events dashboard_updates async_events_dlq dashboard_updates_dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1;
        done

  migrate:
    image: online-auction-benchmark-migrator:${BENCHMARK_IMAGE_TAG:-local}
    environment:
      NODE_ENV: benchmark
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/online_auction_benchmark?schema=public&connection_limit=10
      DIRECT_URL: postgresql://benchmark:benchmark@postgres:5432/online_auction_benchmark?schema=public
    depends_on:
      postgres: { condition: service_healthy }

  api: &backend
    image: online-auction-benchmark-runtime:${BENCHMARK_IMAGE_TAG:-local}
    command: node dist/server.js
    environment: &backend_environment
      NODE_ENV: benchmark
      PORT: 5000
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/online_auction_benchmark?schema=public&connection_limit=10
      DIRECT_URL: postgresql://benchmark:benchmark@postgres:5432/online_auction_benchmark?schema=public
      REDIS_URL: redis://redis:6379/0
      BID_DURABILITY_REPLICAS: ${BID_DURABILITY_REPLICAS:-1}
      BID_DURABILITY_WAIT_MS: "100"
      BID_MUTATION_CONNECTIONS: ${BID_MUTATION_CONNECTIONS:-16}
      KAFKA_BROKERS: kafka:9092
      KAFKA_SSL: "false"
      BID_ENGINE: redis
      BID_PROJECTOR_GROUP: benchmark-projector-v1
      EMAIL_DELIVERY_MODE: disabled
      JWT_SECRET: benchmark-local-secret-only
      CLIENT_URL: http://benchmark.local
      API_RATE_LIMIT: 1000000
      BENCHMARK_ISOLATED: "true"
      BENCHMARK_DATABASE_NAME: online_auction_benchmark
      BENCHMARK_RUN_ID: ${BENCHMARK_RUN_ID}
      LOG_LEVEL: warn
    ports: ["127.0.0.1::5000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-replica: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  auction-worker:
    <<: *backend
    command: node dist/auction-worker.js
    ports: []
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/online_auction_benchmark?schema=public&connection_limit=16
      BID_PROJECTOR_READ_COUNT: 200
      BID_PROJECTOR_CONCURRENCY: ${BID_PROJECTOR_CONCURRENCY:-8}
      AUCTION_CLOSE_INTERVAL_MS: 1000
      AUCTION_WORKER_HEARTBEAT_TTL_SECONDS: 90

  outbox-relay:
    <<: *backend
    command: node dist/outbox-relay.js
    ports: []
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/online_auction_benchmark?schema=public&connection_limit=5
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_IDLE_POLL_MS: 250

  async-worker:
    <<: *backend
    command: node dist/async-worker.js
    ports: []
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/online_auction_benchmark?schema=public&connection_limit=12
      DASHBOARD_DEBOUNCE_MS: 1000
      DASHBOARD_BATCH_CONCURRENCY: ${DASHBOARD_BATCH_CONCURRENCY:-8}
      NOTIFICATION_BATCH_CONCURRENCY: ${NOTIFICATION_BATCH_CONCURRENCY:-8}

volumes:
  postgres:
  redis:
  redis-replica:
  kafka:
