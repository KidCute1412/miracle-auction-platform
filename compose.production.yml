services:
  migrate:
    build:
      context: ./Backend
    image: online-auction-backend:latest
    command: npx prisma migrate deploy
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}

  api:
    build:
      context: ./Backend
    image: online-auction-backend:latest
    command: npm run start:prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      CLIENT_URL: ${CLIENT_URL}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_SSL: ${KAFKA_SSL:-true}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_CA: ${KAFKA_CA:-}
      KAFKA_BIDDING_TOPIC: ${KAFKA_BIDDING_TOPIC:-bidding_events}
      KAFKA_DASHBOARD_TOPIC: ${KAFKA_DASHBOARD_TOPIC:-dashboard_updates}
      KAFKA_DASHBOARD_DLQ_TOPIC: ${KAFKA_DASHBOARD_DLQ_TOPIC:-dashboard_updates_dlq}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  worker:
    image: online-auction-backend:latest
    command: npm run worker:prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_SSL: ${KAFKA_SSL:-true}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_CA: ${KAFKA_CA:-}
      KAFKA_BIDDING_TOPIC: ${KAFKA_BIDDING_TOPIC:-bidding_events}
      KAFKA_DASHBOARD_TOPIC: ${KAFKA_DASHBOARD_TOPIC:-dashboard_updates}
      KAFKA_DASHBOARD_DLQ_TOPIC: ${KAFKA_DASHBOARD_DLQ_TOPIC:-dashboard_updates_dlq}
      DASHBOARD_KAFKA_GROUP_ID: ${DASHBOARD_KAFKA_GROUP_ID:-dashboard-analytics-v1}
      DASHBOARD_DEBOUNCE_MS: ${DASHBOARD_DEBOUNCE_MS:-15000}
      DASHBOARD_RECOVERY_INTERVAL_MS: ${DASHBOARD_RECOVERY_INTERVAL_MS:-60000}
      DASHBOARD_STALE_THRESHOLD_MS: ${DASHBOARD_STALE_THRESHOLD_MS:-120000}
      DASHBOARD_RETRY_LIMIT: ${DASHBOARD_RETRY_LIMIT:-5}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
