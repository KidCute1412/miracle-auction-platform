x-backend-worker: &backend-worker
  build:
    context: ./Backend
    dockerfile: Dockerfile
  volumes:
    - ./Backend:/app
    - /app/node_modules
  environment: &backend-worker-environment
    DATABASE_URL: postgresql://postgres:my_local_password@postgres:5432/online_auction_test?schema=public
    DIRECT_URL: postgresql://postgres:my_local_password@postgres:5432/online_auction_test?schema=public
    REDIS_URL: redis://redis:6379
    BID_ENGINE: redis
    KAFKA_BROKERS: kafka:9092
    KAFKA_SSL: "false"
    KAFKA_BIDDING_TOPIC: bidding_events
    KAFKA_DOMAIN_TOPIC: domain_events
    KAFKA_DASHBOARD_TOPIC: dashboard_updates
    KAFKA_ASYNC_DLQ_TOPIC: async_events_dlq
    KAFKA_DASHBOARD_DLQ_TOPIC: dashboard_updates_dlq
    EMAIL_DELIVERY_MODE: disabled
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    container_name: online-auction-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_local_password
      POSTGRES_DB: online_auction_test
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online_auction_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: online-auction-redis
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    container_name: online-auction-kafka
    ports:
      - "19092:9092"
      - "19094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic bidding_events --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic domain_events --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dashboard_updates --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic async_events_dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dashboard_updates_dlq --partitions 1 --replication-factor 1

  auction-worker:
    <<: *backend-worker
    container_name: online-auction-auction-worker
    command: npm run auction-worker:prod
    environment:
      <<: *backend-worker-environment
      BID_PROJECTOR_GROUP: postgres-projector-v1
      BID_PROJECTOR_MAX_ATTEMPTS: 10
      BID_PROJECTOR_RECLAIM_INTERVAL_MS: 30000
      AUCTION_CLOSE_INTERVAL_MS: 1000
      AUCTION_WORKER_HEARTBEAT_TTL_SECONDS: 90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-relay:
    <<: *backend-worker
    container_name: online-auction-outbox-relay
    command: npm run outbox-relay:prod
    environment:
      <<: *backend-worker-environment
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_IDLE_POLL_MS: 500
      OUTBOX_MAX_BACKOFF_MS: 300000
      OUTBOX_RELAY_HEARTBEAT_TTL_SECONDS: 90
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  async-worker:
    <<: *backend-worker
    container_name: online-auction-async-worker
    command: npm run async-worker:prod
    environment:
      <<: *backend-worker-environment
      DASHBOARD_KAFKA_GROUP_ID: dashboard-analytics-v1
      NOTIFICATION_KAFKA_GROUP_ID: notification-intake-v1
      DASHBOARD_DEBOUNCE_MS: 15000
      DASHBOARD_RECOVERY_INTERVAL_MS: 60000
      DASHBOARD_STALE_THRESHOLD_MS: 120000
      DASHBOARD_RETRY_LIMIT: 5
      EMAIL_DELIVERY_CONCURRENCY: 2
      EMAIL_DELIVERY_MAX_ATTEMPTS: 5
      EMAIL_DELIVERY_LEASE_MS: 300000
      ASYNC_WORKER_HEARTBEAT_TTL_SECONDS: 90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  kafka_data:
