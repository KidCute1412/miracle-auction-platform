name: Deploy Hetzner demo

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Never deploy a failed CI run or a pull-request workflow run.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: hetzner-demo-deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_SSH_KNOWN_HOST: ${{ secrets.HETZNER_SSH_KNOWN_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HETZNER_SSH_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Deploy the tested commit
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$HETZNER_DEPLOY_USER@$HETZNER_SSH_HOST" \
            "DEPLOY_COMMIT='$DEPLOY_COMMIT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/online-auction/repo
          bash scripts/deploy-hetzner-demo.sh
          REMOTE
